{% extends "base.html" %}

{% block title %}Projects - Portfolio{% endblock %}

{% block content %}
    <section style="padding-top: 8rem;">
        <div class="container">
            <h2>All Projects</h2>
            <div class="gallery">
                {% for project in projects %}
                <div class="gallery-item">
                    <img src="{{ project.image }}" alt="{{ project.title }}" class="gallery-img">
                    <div class="gallery-content">
                        <span class="gallery-tag">{{ project.category }}</span>
                        <h3>{{ project.title }}</h3>
                        <p>{{ project.description }}</p>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </section>
{% endblock %}
