{% extends "base.html" %}

{% block title %}Contact - Portfolio{% endblock %}

{% block content %}
    <section style="padding-top: 8rem;">
        <div class="container" style="max-width: 600px;">
            <h2>Get In Touch</h2>
            <p style="text-align: center; color: var(--text-light); font-size: 1.1rem; margin-bottom: 2.5rem;">
                Have a project in mind or want to collaborate? I'd love to hear from you!
            </p>

            <div style="background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);">
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>

            <div style="margin-top: 3rem;">
                <h3 style="text-align: center; margin-bottom: 2rem; color: var(--primary);">Other Ways to Reach Me</h3>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                    <div style="text-align: center; padding: 1.5rem; background: #f8fafc; border-radius: 10px;">
                        <h4 style="color: var(--primary); margin-bottom: 0.5rem;">Email</h4>
                        <a href="mailto:hello@example.com" style="color: var(--secondary); text-decoration: none; font-weight: 500;">
                            hello@example.com
                        </a>
                    </div>
                    <div style="text-align: center; padding: 1.5rem; background: #f8fafc; border-radius: 10px;">
                        <h4 style="color: var(--primary); margin-bottom: 0.5rem;">Social Media</h4>
                        <a href="https://twitter.com" style="color: var(--secondary); text-decoration: none; font-weight: 500;">
                            @alexrivera
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                name: formData.get('name'),
                email: formData.get('email'),
                subject: formData.get('subject'),
                message: formData.get('message')
            };

            console.log('Form submitted:', data);
            alert('Thank you for your message! I will get back to you soon.');
            this.reset();
        });
    </script>
{% endblock %}
